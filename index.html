<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c"><title>G2 Master BLE Lab V3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07090c;color:#f5f7fa;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.brand{font-weight:900;letter-spacing:.15em}.pill{padding:8px 12px;border:1px solid #29303a;border-radius:999px;color:#aeb7c4;font-size:12px}
.card{background:#10141a;border:1px solid #252c36;border-radius:22px;padding:20px;margin-bottom:14px}
h1{font-size:25px;margin:0 0 7px}.sub{color:#909aa8;font-size:13px}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #242b34}.row:last-child{border:0}
.ok{color:#73e69a;font-weight:800}.wait{color:#f2c86b;font-weight:800}.bad{color:#ff7474;font-weight:800}
button{width:100%;border:0;border-radius:17px;padding:18px;font-size:16px;font-weight:900;background:#ff5938;color:white;margin:4px 0 14px}
button:disabled{opacity:.45}.secondary{background:#1b222b;border:1px solid #303946}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#080a0d;border:1px solid #252c36;border-radius:16px;padding:14px;min-height:210px;max-height:420px;overflow:auto;color:#cad4df;font-size:12px;line-height:1.55}
.note{font-size:12px;color:#828c99;text-align:center;margin:8px 10px 24px}
</style></head><body><div class="wrap">
<div class="top"><div class="brand">G2 MASTER</div><div class="pill">BLE LAB V3</div></div>
<div class="card"><h1>Analyse GATT</h1><div class="sub">Diagnostic uniquement : aucune écriture sur 8877.</div>
<div class="row"><span>Connexion</span><span id="conn" class="wait">NON CONNECTÉ</span></div>
<div class="row"><span>Service 7777</span><span id="svc" class="wait">—</span></div>
<div class="row"><span>Écriture 8877</span><span id="wr" class="wait">—</span></div>
<div class="row"><span>Notifications 8888</span><span id="ntf" class="wait">—</span></div>
<div class="row"><span>Paquets reçus</span><span id="count">0</span></div></div>
<button id="connect">CONNECTER G2 MASTER</button>
<button id="clear" class="secondary">EFFACER LE JOURNAL</button>
<div class="card"><h1>Journal BLE brut</h1><pre id="log"></pre></div>
<div class="note">V3 n'envoie aucune commande à la trottinette. Elle découvre 8877 et écoute seulement 8888.</div>
</div>
<script>
(()=>{const $=id=>document.getElementById(id),logEl=$("log");let n=0,device;
function log(s){const d=new Date(),t=d.toLocaleTimeString();logEl.textContent+=`[${t}] ${s}\n`;logEl.scrollTop=logEl.scrollHeight}
function state(id,text,cls="ok"){let e=$(id);e.textContent=text;e.className=cls}
function hex(v){let a=new Uint8Array(v.buffer,v.byteOffset,v.byteLength);return [...a].map(x=>x.toString(16).padStart(2,"0")).join(" ")}
log("V3 démarrée.");log("Mode diagnostic lecture seule.");
$("clear").onclick=()=>{logEl.textContent="";log("Journal effacé.")};
$("connect").onclick=async()=>{
 try{
  log("Ouverture du sélecteur Bluetooth…");
  device=await navigator.bluetooth.requestDevice({filters:[{name:"Scooter"}],optionalServices:["00007777-0000-1000-8000-00805f9b34fb"]});
  log("Appareil choisi : "+(device.name||"?"));
  device.addEventListener("gattserverdisconnected",()=>{state("conn","DÉCONNECTÉ","bad");log("GATT déconnecté.")});
  log("Connexion GATT…");let server=await device.gatt.connect();state("conn","CONNECTÉ");log("GATT connecté.");
  let svc=await server.getPrimaryService("00007777-0000-1000-8000-00805f9b34fb");state("svc","TROUVÉ");log("Service 7777 trouvé.");
  try{
   let wr=await svc.getCharacteristic("00008877-0000-1000-8000-00805f9b34fb");
   state("wr","TROUVÉ");log("Characteristic 8877 trouvée (aucune écriture effectuée).");
   log("8877 propriétés : write="+wr.properties.write+", writeWithoutResponse="+wr.properties.writeWithoutResponse);
  }catch(e){state("wr","INTROUVABLE","bad");log("8877 erreur : "+e.message)}
  let ch=await svc.getCharacteristic("00008888-0000-1000-8000-00805f9b34fb");
  log("Characteristic 8888 trouvée.");
  ch.addEventListener("characteristicvaluechanged",e=>{n++;$("count").textContent=n;log("8888 ← "+hex(e.target.value))});
  await ch.startNotifications();state("ntf","ACTIVES");log("Notifications 8888 activées.");
  try{let v=await ch.readValue();log("Lecture initiale 8888 ← "+hex(v))}catch(e){log("Lecture 8888 non disponible : "+e.message)}
  log("En écoute. Si aucun paquet n'arrive, c'est une information utile : il faudra identifier la requête de lecture envoyée par Lenzod.");
 }catch(e){log("ERREUR : "+(e.message||e));}
};
})();
</script></body></html>
