<script>
const S='00007777-0000-1000-8000-00805f9b34fb',R='00008888-0000-1000-8000-00805f9b34fb',W='00008877-0000-1000-8000-00805f9b34fb',Q=new Uint8Array([255,85,1,0,85]);let d,r,w,t,busy=false,rs=0,lastVals={},diagChanges=false;const $=x=>document.getElementById(x),be=a=>a.reduce((n,b)=>n*256+b,0);function log(x){$('log').textContent=x+'\n'+$('log').textContent}function speed(v){v=Math.max(0,Math.min(80,+v||0));$('speed').textContent=Math.round(v);$('speedClipRect').setAttribute('width',700*v/80)}function mode(v){let x=v==2?['ECO','1','#54e777']:v==3?['RACE','2','#13c8f4']:v==4?['SPORT','3','#ff4549']:['G2','-','#13c8f4'];$('mode').textContent=x[0];$('gear').textContent=x[1];$('dash').style.setProperty('--a','#13c8f4')}function tm(m){let s=Math.round(m*60),h=Math.floor(s/3600),mi=Math.floor(s%3600/60),ss=s%60;return[h,mi,ss].map(x=>String(x).padStart(2,'0')).join(':')}function pkt(u){if(u.length<5||u[0]!=255||u[1]!=85)return;let id=u[2],v=be([...u.slice(4,4+u[3])]);
if(diagChanges && lastVals[id]!==undefined && lastVals[id]!==v)
 log('ID 0x'+id.toString(16).padStart(2,'0').toUpperCase()+' : '+lastVals[id]+' → '+v+' | HEX '+[...u.slice(4,4+u[3])].map(x=>x.toString(16).padStart(2,'0')).join(' '));
lastVals[id]=v;if(id==10){
let raw=v,base=raw/1000,wrap=(raw+65536)/1000;
if(rs>52 && raw<20000 && Math.abs(wrap-rs)<Math.abs(base-rs)) rs=wrap;
else rs=base;
speed(rs)
}if(id==12)$('odo').textContent=(v/1000).toFixed(1)+' km';if(id==13)$('battery').textContent=v+'%';if(id==31)mode(v);if(id==34)$('time').textContent=tm(v)}async function req(){if(!w||busy)return;busy=true;try{await w.writeValue(Q)}catch(e){log(e.message)}finally{busy=false}}function sweep(){let z=performance.now();function f(n){let p=Math.min(1,(n-z)/1800),v=p<.5?160*p:160*(1-p);speed(v);if(p<1)requestAnimationFrame(f);else speed(rs)}requestAnimationFrame(f)}async function connect(){try{$('connect').disabled=true;d=await navigator.bluetooth.requestDevice({filters:[{name:'Scooter'}],optionalServices:[S]});let g=await d.gatt.connect(),s=await g.getPrimaryService(S);r=await s.getCharacteristic(R);w=await s.getCharacteristic(W);await r.startNotifications();r.addEventListener('characteristicvaluechanged',e=>pkt(new Uint8Array(e.target.value.buffer,e.target.value.byteOffset,e.target.value.byteLength)));$('connect').textContent='G2 CONNECTÉE';$('homeConnect').textContent='G2 CONNECTÉE';$('homeStatus').textContent='G2 connectée • prête';sweep();setTimeout(req,1900);t=setInterval(req,2000)}catch(e){log(e.message);$('connect').disabled=false;$('homeConnect').disabled=false}}$('connect').onclick=connect;$('diag').onclick=()=>{
 $('log').classList.toggle('show');
 diagChanges=$('log').classList.contains('show');
 if(diagChanges) log('DIAGNOSTIC ACTIF — fais : gauche → arrêt → droite → arrêt');
};
function setLean(deg){
 if(!Number.isFinite(deg))return;
 deg=Math.max(-90,Math.min(90,deg));
 $('lean').textContent=(deg>0?'+':'')+Math.round(deg)+'°';
}
function orientationLean(e){
 // gamma = inclinaison gauche/droite en portrait.
 // En paysage on adapte selon l'orientation de l'écran.
 let a=screen.orientation&&typeof screen.orientation.angle==='number'?screen.orientation.angle:(window.orientation||0);
 let v=(Math.abs(a)===90)?(a===90?-e.beta:e.beta):e.gamma;
 setLean(v||0);
}
async function enableSensors(){
 try{
  if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
   const p=await DeviceOrientationEvent.requestPermission();
   if(p!=='granted')throw new Error('Permission capteurs refusée');
  }
  window.addEventListener('deviceorientation',orientationLean,true);
  $('sensor').textContent='ANGLE ✓';
  log('Capteur d’inclinaison activé');
 }catch(e){log('ANGLE : '+e.message)}
}
$('sensor').onclick=enableSensors;


$('homeConnect').onclick=connect;
$('homeSensor').onclick=enableSensors;
$('startRide').onclick=async()=>{

 try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')}catch(e){}
 setTimeout(()=>window.dispatchEvent(new Event('resize')),120);
};
$('exitRide').onclick=async()=>{
 $('dashPage').style.display='none';
 document.body.classList.remove('ride-mode');
 $('homePage').style.display='flex';
 try{if(document.fullscreenElement)await document.exitFullscreen()}catch(e){}
};


['touchmove','gesturestart','gesturechange','gestureend'].forEach(ev=>{

});
document.addEventListener('dblclick',e=>{if(document.body.classList.contains('ride-mode'))e.preventDefault()},{passive:false});
