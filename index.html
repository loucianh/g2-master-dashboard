<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<title>G2 Master BLE Test V2</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#07090c;color:#f5f7fa;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-weight:900;letter-spacing:.14em}.pill{padding:7px 11px;border:1px solid #29303a;border-radius:999px;font-size:12px;color:#aab3c0}
.card{background:#10141a;border:1px solid #252c36;border-radius:22px;padding:18px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 6px} .muted{color:#909aa8;font-size:13px}
.check{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #222933}.check:last-child{border:0}
.ok{color:#73e69a;font-weight:800}.bad{color:#ff7474;font-weight:800}.wait{color:#f2c86b;font-weight:800}
button{width:100%;border:0;border-radius:16px;padding:17px;font-size:16px;font-weight:900;background:#ff5b36;color:white;margin:5px 0 14px}
button:active{transform:scale(.99)}button:disabled{opacity:.45}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#080a0d;border:1px solid #252c36;border-radius:16px;padding:14px;min-height:170px;color:#cbd4df;font-size:12px;line-height:1.5}
.small{font-size:12px;color:#7f8996;text-align:center}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><div class="brand">G2 MASTER</div><div class="pill">BLE LAB V2</div></div>
 <div class="card">
  <h1>Diagnostic Bluetooth</h1>
  <div class="muted">Aucune commande n'est envoyée à la trottinette.</div>
  <div style="margin-top:12px">
   <div class="check"><span>JavaScript</span><span id="js" class="wait">TEST…</span></div>
   <div class="check"><span>HTTPS</span><span id="https" class="wait">TEST…</span></div>
   <div class="check"><span>Web Bluetooth</span><span id="bt" class="wait">TEST…</span></div>
  </div>
 </div>
 <button id="connect">RECHERCHER LA TROTTINETTE</button>
 <div class="card">
  <h1>Journal BLE</h1>
  <pre id="log">Chargement…</pre>
 </div>
 <div class="small">Ferme Lenzod Pro et nRF Connect avant le test.</div>
</div>
<script>
(function(){
 const logEl=document.getElementById('log'), btn=document.getElementById('connect');
 function log(x){logEl.textContent += "\n> "+x; logEl.scrollTop=logEl.scrollHeight}
 logEl.textContent="> Dashboard démarré";
 document.getElementById('js').textContent="OK"; document.getElementById('js').className="ok";
 const secure=window.isSecureContext;
 document.getElementById('https').textContent=secure?"OK":"NON";
 document.getElementById('https').className=secure?"ok":"bad";
 const hasBT=!!(navigator.bluetooth && navigator.bluetooth.requestDevice);
 document.getElementById('bt').textContent=hasBT?"OK":"INDISPONIBLE";
 document.getElementById('bt').className=hasBT?"ok":"bad";
 log("HTTPS : "+(secure?"OK":"NON"));
 log("Web Bluetooth : "+(hasBT?"disponible":"indisponible dans ce navigateur"));
 if(!hasBT){btn.disabled=true;log("Si Bluetooth est indisponible, envoie une capture de cet écran.");}
 btn.addEventListener('click', async function(){
   log("Ouverture du sélecteur Bluetooth…");
   try{
     const device=await navigator.bluetooth.requestDevice({
       filters:[{name:"Scooter"}],
       optionalServices:["00007777-0000-1000-8000-00805f9b34fb"]
     });
     log("Appareil choisi : "+(device.name||"sans nom"));
     log("Connexion GATT…");
     const server=await device.gatt.connect();
     log("GATT connecté.");
     const service=await server.getPrimaryService("00007777-0000-1000-8000-00805f9b34fb");
     log("Service 7777 trouvé.");
     const ch=await service.getCharacteristic("00008888-0000-1000-8000-00805f9b34fb");
     log("Characteristic 8888 trouvée.");
     await ch.startNotifications();
     log("Notifications 8888 activées. En attente de données…");
     ch.addEventListener("characteristicvaluechanged",e=>{
       const a=new Uint8Array(e.target.value.buffer);
       log("8888 ← "+[...a].map(v=>v.toString(16).padStart(2,"0")).join(" "));
     });
     device.addEventListener("gattserverdisconnected",()=>log("Trottinette déconnectée."));
   }catch(e){
     log("ERREUR : "+(e && e.message ? e.message : String(e)));
   }
 });
})();
</script>
</body>
</html>
