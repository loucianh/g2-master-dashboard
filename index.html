<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070a"><title>G2 Master V5.1</title>
<style>*{box-sizing:border-box}body{margin:0;background:#05070a;color:#f5f7fa;font-family:system-ui,-apple-system,sans-serif}.app{max-width:760px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between}.brand{font-weight:900;letter-spacing:.12em}.status{color:#8993a1;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:6px}.dot.on{background:#fff;box-shadow:0 0 12px #fff}.hero,.card{background:#0b0f14;border:1px solid #222a34}.hero{margin-top:14px;border-radius:28px;padding:22px 18px;text-align:center}.mode{font-weight:900;letter-spacing:.22em;color:#aab3bf}.speed{font-size:clamp(100px,32vw,210px);font-weight:950;line-height:.85;letter-spacing:-.08em;margin:20px 0 4px}.unit,.label{color:#8993a1;font-size:11px;letter-spacing:.12em}.bar{height:5px;background:#171d25;border-radius:8px;margin:25px 5px 16px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff}.quick{display:grid;grid-template-columns:repeat(3,1fr)}.q{border-top:1px solid #222a34;padding:12px 4px}.q b{font-size:21px}.q span{display:block;color:#8993a1;font-size:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}.card{border-radius:20px;padding:16px}.value{font-size:25px;font-weight:850;margin-top:5px}.ghost .value{color:#68717e}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}button{border:1px solid #303947;background:#111720;color:white;border-radius:18px;padding:16px;font-weight:850}.primary{background:#f2f4f6;color:#080a0d}.note{text-align:center;color:#707a87;font-size:11px;margin:13px}.log{display:none;margin-top:12px;background:#080b0f;border:1px solid #222a34;border-radius:16px;padding:12px;color:#8e98a5;font:11px monospace;max-height:130px;overflow:auto;white-space:pre-wrap}.log.show{display:block}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head>
<body><main class="app"><div class="top"><div class="brand">G2 MASTER // V5.1</div><div class="status"><i id="dot" class="dot"></i><span id="bleText">BLE déconnecté</span></div></div>
<section class="hero"><div id="mode" class="mode">—</div><div id="speed" class="speed">0</div><div class="unit">KM/H</div><div class="bar"><i id="speedBar"></i></div><div class="quick"><div class="q"><b id="battery">--%</b><span>BATTERIE</span></div><div class="q"><b id="trip">--</b><span>TRIP KM</span></div><div class="q"><b id="time">--</b><span>DURÉE</span></div></div></section>
<section class="grid"><div class="card"><div class="label">ODOMÈTRE</div><div id="odo" class="value">-- km</div></div><div class="card"><div class="label">FEUX</div><div id="lights" class="value">--</div></div><div class="card"><div class="label">VERROU</div><div id="lock" class="value">--</div></div><div class="card"><div class="label">RÉGULATEUR</div><div id="cruise" class="value">--</div></div><div class="card ghost"><div class="label">VOLTAGE</div><div class="value">-- V</div></div><div class="card ghost"><div class="label">COURANT</div><div class="value">-- A</div></div><div class="card ghost"><div class="label">PUISSANCE</div><div class="value">-- kW</div></div><div class="card"><div class="label">TEMPÉRATURE</div><div id="temp" class="value">-- °C</div></div></section>
<div class="controls"><button id="connect" class="primary">CONNECTER LA G2</button><button id="diag">DIAGNOSTIC</button></div><div id="log" class="log"></div><div class="note">Lecture uniquement • statut toutes les 2 s • aucun réglage contrôleur modifié.</div></main>
<script>
const S='00007777-0000-1000-8000-00805f9b34fb',R='00008888-0000-1000-8000-00805f9b34fb',W='00008877-0000-1000-8000-00805f9b34fb',STATUS=new Uint8Array([255,85,1,0,85]);let d,r,w,t,busy=false;const $=x=>document.getElementById(x),be=a=>a.reduce((n,b)=>n*256+b,0);function log(x){$('log').textContent='['+new Date().toLocaleTimeString()+'] '+x+'\n'+$('log').textContent}function dur(m){return m<60?m+' min':Math.floor(m/60)+'h '+m%60+'m'}function pkt(u){if(u.length<5||u[0]!=255||u[1]!=85)return;let sum=[...u.slice(0,-1)].reduce((a,b)=>(a+b)&255,0);if(sum!=u[u.length-1])return;let id=u[2],v=be([...u.slice(4,4+u[3])]);if(id==10){let s=v/1000;$('speed').textContent=Math.round(s);$('speedBar').style.width=Math.min(100,s/70*100)+'%'}if(id==11)$('trip').textContent=(v/1000).toFixed(2);if(id==12)$('odo').textContent=(v/1000).toFixed(1)+' km';if(id==13)$('battery').textContent=v+'%';if(id==17)$('temp').textContent=v+' °C';if(id==23)$('lock').textContent=v==1?'OFF':v==2?'ON':v;if(id==29)$('cruise').textContent=v==1?'ON':v==2?'OFF':v;if(id==31)$('mode').textContent=({2:'ECO',3:'NORMAL',4:'SPORT'})[v]||'MODE '+v;if(id==34)$('time').textContent=dur(v);if(id==36)$('lights').textContent=v==1?'ON':v==0?'OFF':v;log('0x'+id.toString(16).padStart(2,'0')+' ← '+[...u].map(x=>x.toString(16).padStart(2,'0')).join(' '))}
async function req(){if(!w||busy)return;busy=true;try{await w.writeValue(STATUS)}catch(e){log(e.message)}finally{busy=false}}function off(){clearInterval(t);r=w=null;$('dot').classList.remove('on');$('bleText').textContent='BLE déconnecté';$('connect').disabled=false;$('connect').textContent='RECONNECTER'}async function connect(){try{$('connect').disabled=true;$('connect').textContent='CONNEXION…';d=await navigator.bluetooth.requestDevice({filters:[{name:'Scooter'}],optionalServices:[S]});d.addEventListener('gattserverdisconnected',off);let g=await d.gatt.connect(),s=await g.getPrimaryService(S);r=await s.getCharacteristic(R);w=await s.getCharacteristic(W);await r.startNotifications();r.addEventListener('characteristicvaluechanged',e=>pkt(new Uint8Array(e.target.value.buffer,e.target.value.byteOffset,e.target.value.byteLength)));$('dot').classList.add('on');$('bleText').textContent='Scooter connecté';$('connect').textContent='CONNECTÉ';await req();t=setInterval(req,2000)}catch(e){log('Connexion: '+e.message);$('connect').disabled=false;$('connect').textContent='CONNECTER LA G2'}}$('connect').onclick=connect;$('diag').onclick=()=>{$('log').classList.toggle('show')};if(!navigator.bluetooth){$('connect').disabled=true;$('bleText').textContent='Web Bluetooth indisponible'}
</script></body></html>
